name: check-new-links
on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # una run alla volta: evita messaggi doppi e conflitti con cron-job sul push di seen.json
  group: check-new-links
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install feedparser requests
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
